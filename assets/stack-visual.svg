<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120">
  <defs>
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61DAFB"/>
      <stop offset="100%" style="stop-color:#21A0D0"/>
    </linearGradient>
    <linearGradient id="viteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#646CFF"/>
      <stop offset="100%" style="stop-color:#4A52CC"/>
    </linearGradient>
    <linearGradient id="katexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D3362D"/>
      <stop offset="100%" style="stop-color:#B82C21"/>
    </linearGradient>
    <linearGradient id="lucideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399"/>
      <stop offset="100%" style="stop-color:#2AB082"/>
    </linearGradient>
  </defs>
  
  <!-- React -->
  <g transform="translate(50, 60)">
    <circle r="40" fill="url(#reactGrad)" opacity="0.9">
      <animate attributeName="r" values="38;42;38" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#000">React</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 100 60 L 140 60" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)">
    <animate attributeName="d" values="M 100 60 L 140 60;M 105 60 L 145 60;M 100 60 L 140 60" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Vite -->
  <g transform="translate(180, 60)">
    <circle r="40" fill="url(#viteGrad)" opacity="0.9">
      <animate attributeName="r" values="38;42;38" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff">Vite</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 230 60 L 270 60" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)">
    <animate attributeName="d" values="M 230 60 L 270 60;M 235 60 L 275 60;M 230 60 L 270 60" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- KaTeX -->
  <g transform="translate(310, 60)">
    <circle r="40" fill="url(#katexGrad)" opacity="0.9">
      <animate attributeName="r" values="38;42;38" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#fff">KaTeX</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 360 60 L 400 60" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)">
    <animate attributeName="d" values="M 360 60 L 400 60;M 365 60 L 405 60;M 360 60 L 400 60" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Lucide -->
  <g transform="translate(440, 60)">
    <circle r="40" fill="url(#lucideGrad)" opacity="0.9">
      <animate attributeName="r" values="38;42;38" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#000">Lucide</text>
  </g>
  
  <!-- Arrow -->
  <path d="M 490 60 L 530 60" stroke="#475569" stroke-width="2" marker-end="url(#arrowhead)">
    <animate attributeName="d" values="M 490 60 L 530 60;M 495 60 L 535 60;M 490 60 L 530 60" dur="1.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Output -->
  <g transform="translate(560, 60)">
    <rect x="-30" y="-25" width="60" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Output</text>
    <text y="12" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e">✨ Web</text>
  </g>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
</svg>
