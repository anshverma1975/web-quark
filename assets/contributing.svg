<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f87171"/>
      <stop offset="100%" style="stop-color:#facc15"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  
  <!-- Flow visualization -->
  <g transform="translate(0, 20)">
    <!-- Fork -->
    <g transform="translate(50, 50)">
      <circle r="25" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#22c55e">Fork</text>
      <text y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">🍴</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 80 50 L 120 50" stroke="#475569" stroke-width="2" marker-end="url(#cArrow)"/>
    
    <!-- Code -->
    <g transform="translate(150, 50)">
      <circle r="25" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#60a5fa">Code</text>
      <text y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">💻</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 180 50 L 220 50" stroke="#475569" stroke-width="2" marker-end="url(#cArrow)"/>
    
    <!-- Test -->
    <g transform="translate(250, 50)">
      <circle r="25" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
      <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#a78bfa">Test</text>
      <text y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">✅</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 280 50 L 320 50" stroke="#475569" stroke-width="2" marker-end="url(#cArrow)"/>
    
    <!-- PR -->
    <g transform="translate(350, 50)">
      <circle r="25" fill="#1e293b" stroke="#facc15" stroke-width="2">
        <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#facc15">PR</text>
      <text y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">🚀</text>
    </g>
  </g>
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="cArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>
</svg>
