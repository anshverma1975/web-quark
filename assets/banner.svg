<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#60a5fa;#34d399;#a78bfa" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#34d399;#a78bfa;#60a5fa" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="16"/>
  
  <!-- Animated particles -->
  <circle cx="100" cy="50" r="2" fill="#a78bfa" opacity="0.6">
    <animate attributeName="cy" values="50;150;50" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="150" r="2" fill="#60a5fa" opacity="0.6">
    <animate attributeName="cy" values="150;50;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="30" r="2" fill="#34d399" opacity="0.6">
    <animate attributeName="cy" values="30;170;30" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="120" r="2" fill="#facc15" opacity="0.6">
    <animate attributeName="cy" values="120;80;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="80" r="2" fill="#f87171" opacity="0.6">
    <animate attributeName="cy" values="80;140;80" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Decorative lines -->
  <line x1="50" y1="180" x2="750" y2="180" stroke="#a78bfa" stroke-width="1" opacity="0.2"/>
  <line x1="50" y1="20" x2="750" y2="20" stroke="#60a5fa" stroke-width="1" opacity="0.2"/>
  
  <!-- Main text -->
  <text x="400" y="95" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="url(#text)" filter="url(#glow)">
    ✨ Quarkdown Web
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">
    A browser-based editor and live preview workspace for Quarkdown documents
  </text>
  
  <!-- Tech badges -->
  <g transform="translate(400, 160)">
    <rect x="-120" y="-12" width="60" height="24" rx="12" fill="#61DAFB" opacity="0.9"/>
    <text x="-90" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#000">React</text>
    
    <rect x="-40" y="-12" width="60" height="24" rx="12" fill="#646CFF" opacity="0.9"/>
    <text x="-10" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">Vite</text>
    
    <rect x="40" y="-12" width="60" height="24" rx="12" fill="#D3362D" opacity="0.9"/>
    <text x="70" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#fff">KaTeX</text>
  </g>
</svg>
